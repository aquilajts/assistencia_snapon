{% extends "base.html" %}
{% block title %}Editar serviço #{{ servico['id'] }}{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <p class="eyebrow">EDITAR CADASTRO</p>
        <h1>{{ servico['cliente'] }}</h1>
    </div>
</div>

<form method="post" class="form-card">
    {% if erro %}<div class="alert">{{ erro }}</div>{% endif %}

    <div class="form-section">
        <label>Tipo de serviço</label>
        <div class="choice-grid">
            <label class="choice">
                <input type="radio" name="tipo" value="Montagem" {% if servico['tipo'] == 'Montagem' %}checked{% endif %}>
                <span><b>Montagem</b></span>
            </label>
            <label class="choice">
                <input type="radio" name="tipo" value="Assistência Técnica" {% if servico['tipo'] == 'Assistência Técnica' %}checked{% endif %}>
                <span><b>Assistência Técnica</b></span>
            </label>
            <label class="choice">
                <input type="radio" name="tipo" value="Garantia" {% if servico['tipo'] == 'Garantia' %}checked{% endif %}>
                <span><b>Garantia</b></span>
            </label>
            <label class="choice">
                <input type="radio" name="tipo" value="Rascunho" {% if servico['tipo'] == 'Rascunho' %}checked{% endif %}>
                <span><b>Rascunho</b></span>
            </label>
        </div>
    </div>

    <div class="form-grid">
        <div>
            <label for="cidade">Cidade *</label>
            <input id="cidade" name="cidade" list="municipios" value="{{ servico.get('cidade') or '' }}" placeholder="Pesquise ou selecione a cidade" required>
            <datalist id="municipios">
                {% for item in municipios %}
                <option value="{{ item['municipio'] }}" data-regiao="{{ item['regiao'] }}"></option>
                {% endfor %}
            </datalist>
        </div>
        <div>
            <label for="regiao">Região (automática)</label>
            <input id="regiao" type="text" value="{{ regiao_selecionada }}" placeholder="Definida pela cidade" readonly>
        </div>
    </div>

    <div class="form-grid">
        <div>
            <label for="data_prevista">Data prevista</label>
            <input id="data_prevista" type="date" name="data_prevista" value="{{ data_prevista_input }}">
        </div>
    </div>

    <div class="form-grid">
        <div>
            <label for="cliente">Cliente / empresa *</label>
            <input id="cliente" name="cliente" value="{{ servico['cliente'] or '' }}" required>
        </div>
        <div>
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" value="{{ servico['telefone'] or '' }}" placeholder="(27) 99999-9999">
        </div>
    </div>

    <div>
        <label for="endereco">Endereço</label>
        <input id="endereco" name="endereco" value="{{ servico['endereco'] or '' }}" placeholder="Rua, número, cidade">
    </div>

    <div>
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" name="observacoes" rows="5" placeholder="Equipamento, problema relatado, peças, ferramentas, contato...">{{ servico['observacoes'] or '' }}</textarea>
    </div>

    <div class="form-footer">
        <a class="button ghost" href="{{ url_for('detalhes', servico_id=servico['id']) }}">Cancelar</a>
        <button class="button primary" type="submit">Salvar alterações</button>
    </div>
</form>
{% endblock %}
