<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Assistência Técnica{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">S</span>
        <span>
            {% if request.endpoint == 'index' %}
                Snap-on
            {% elif request.endpoint == 'servicos' %}
                Serviços
            {% elif request.endpoint in ['novo_servico', 'editar_servico'] %}
                Cadastro
            {% else %}
                Serviço
            {% endif %}
        </span>
    </a>
    <nav>
        <a class="nav-home" href="{{ url_for('index') }}">Início</a>
        <a href="{{ url_for('servicos') }}">Serviços</a>
        <a class="nav-primary" href="{{ url_for('novo_servico') }}">Cadastro</a>
    </nav>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
