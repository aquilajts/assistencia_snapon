{% extends "base.html" %}
{% block title %}Cadastrar serviço{% endblock %}
{% block content %}
<form method="post" class="form-card">
    {% if erro %}<div class="alert">{{ erro }}</div>{% endif %}

    <div class="form-section">
        <label>Tipo de serviço</label>
        <div class="choice-grid">
            <label class="choice">
                <input type="radio" name="tipo" value="Montagem" checked>
                <span><b>Montagem</b></span>
            </label>
        
            <label class="choice">
                <input type="radio" name="tipo" value="Assistência Técnica">
                <span><b>Assistência Técnica</b></span>
            </label>
        
            <label class="choice">
                <input type="radio" name="tipo" value="Garantia">
                <span><b>Garantia</b></span>
            </label>

            <label class="choice">
                <input type="radio" name="tipo" value="Rascunho">
                <span><b>Rascunho</b></span>
            </label>
        </div>
    </div>

    <div class="form-grid">
        <div>
            <label for="cidade">Cidade *</label>
            <input id="cidade" name="cidade" list="municipios" value="{{ cidade_selecionada }}" placeholder="Pesquise ou selecione a cidade" required>
            <datalist id="municipios">
                {% for item in municipios %}
                <option value="{{ item['municipio'] }}" data-regiao="{{ item['regiao'] }}"></option>
                {% endfor %}
            </datalist>
        </div>
        <div>
            <label for="regiao">Região (automática)</label>
            <input id="regiao" type="text" value="{{ regiao_selecionada }}" placeholder="Definida pela cidade" readonly>
        </div>
    </div>

    <div class="form-grid">
        <div>
            <label for="data_prevista">Data prevista</label>
            <input id="data_prevista" type="date" name="data_prevista">
        </div>
    </div>

    <div class="form-grid">
        <div>
            <label for="cliente">Cliente / empresa *</label>
            <input id="cliente" name="cliente" placeholder="Ex.: Empresa XYZ" required autofocus>
        </div>
    
        <div>
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" placeholder="(27) 99999-9999">
        </div>
    </div>
    
    <div>
        <label for="endereco">Endereço</label>
        <input id="endereco" name="endereco" placeholder="Rua, número, cidade">
    </div>

    <div>
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" name="observacoes" rows="5" placeholder="Equipamento, problema relatado, peças, ferramentas, contato..."></textarea>
    </div>

    <div class="form-footer">
        <a class="button ghost" href="{{ url_for('index') }}">Cancelar</a>
        <button class="button primary" type="submit">Salvar serviço</button>
    </div>
</form>
{% endblock %}
